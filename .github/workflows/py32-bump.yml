name: Carry a PY32 release

# Fork only (home-dimmer): put the PY32 firmware of a patapovich/zdms16-py32 release into
# src/zigbee/secondary_mcu_image.c, test, commit, and build the module firmware on the
# fork's build branch (home-dimmer + the fork-ci build change).

on:
  workflow_dispatch:
    inputs:
      py32_tag:
        description: "zdms16-py32 release tag, e.g. v2.1.10"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-dimmer
          fetch-depth: 0

      - name: The image of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download "${{ inputs.py32_tag }}" --repo patapovich/zdms16-py32 \
            --pattern secondary_mcu_image.c --pattern SHA256SUMS --dir /tmp/py32
          (cd /tmp/py32 && grep secondary_mcu_image.c SHA256SUMS | sha256sum -c -)
          cp /tmp/py32/secondary_mcu_image.c src/zigbee/secondary_mcu_image.c
          grep -m1 "version" src/zigbee/secondary_mcu_image.c || true

      - name: Lint and tests with the new image
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q make python3 python3-pytest python3-yaml python3-jinja2 uncrustify
          find src -name '*.c' -o -name '*.h' | xargs uncrustify -c uncrustify.cfg --check -q
          make tests

      - name: Commit to home-dimmer
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::home-dimmer already carries ${{ inputs.py32_tag }}"
          else
            git commit -qam "Carry PY32 ${{ inputs.py32_tag }}"
            git push origin HEAD:home-dimmer
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build branch and firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git fetch -q origin fork-ci
          git checkout -q -B home-dimmer_build
          git cherry-pick FETCH_HEAD
          git push -f origin home-dimmer_build
          gh workflow run build.yml --ref home-dimmer_build
          echo "::notice::build.yml started on home-dimmer_build; the OTA image lands in its 'Update firmware files' commit"
