name: Carry a PY32 release
# The title names the tag, so zdms16-py32 tools/release/release.sh finds its run.
run-name: Carry PY32 ${{ inputs.py32_tag || github.event.client_payload.tag || 'latest release' }}

# patapovich fork only. The ZDMS16-2 build of the home-dimmer branch carries the own PY32
# MCU firmware (src/zigbee/secondary_mcu_image.c). This puts the newest release of
# patapovich/zdms16-py32 there (hourly check, or at once by hand / by a repository_dispatch
# "py32-release" from that repo), tests it, commits it to home-dimmer and builds the module
# firmware on home-dimmer_build (= home-dimmer + the fork-ci build change). It lives on the
# default branch because scheduled and dispatched workflows only run from there.
# A named tag (by hand or dispatched) that cannot be carried fails the run; the hourly check
# only notes it (home-dimmer ahead of the latest release, or carrying another image of the
# same version by hand).

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      py32_tag:
        description: "zdms16-py32 release tag (empty: the latest release)"
        required: false
      force:
        description: "build even if home-dimmer already carries it; allow an older version or replace another image of the same version"
        type: boolean
        default: false
  repository_dispatch:
    types: [py32-release]

permissions:
  contents: write
  actions: write

concurrency:
  group: py32-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-dimmer
          fetch-depth: 0

      - name: Release to carry
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.py32_tag || github.event.client_payload.tag }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -e
          tag="$TAG_IN"
          explicit=false   # a tag named by hand or by the dispatch: failures fail the run
          if [ -n "$tag" ]; then
            explicit=true
          else
            tag=$(gh release view --repo patapovich/zdms16-py32 --json tagName --jq .tagName)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag vX.Y.Z: '${tag//[^A-Za-z0-9._-]/?}'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo patapovich/zdms16-py32 \
            --pattern secondary_mcu_image.c --pattern SHA256SUMS --dir /tmp/py32
          (cd /tmp/py32 && grep -E '[ *]secondary_mcu_image\.c$' SHA256SUMS | sha256sum -c -)
          ver() { sed -n 's/.*own MCU firmware: version \([0-9.]*\).*/\1/p' "$1" | head -1; }
          bytes() { grep -E '^ +0x' "$1" || true; }   # the image itself (C array rows)
          new=$(ver /tmp/py32/secondary_mcu_image.c); cur=$(ver src/zigbee/secondary_mcu_image.c)
          if ! [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no version in the secondary_mcu_image.c of $tag"
            exit 1
          fi
          echo "release $tag carries $new, home-dimmer carries ${cur:-none}"
          keep() {  # level, message: home-dimmer stays as it is
            echo "change=false" >> "$GITHUB_OUTPUT"
            if [ "$explicit" = true ]; then
              echo "::error::$2"
              exit 1
            fi
            echo "::$1::$2"
            exit 0
          }
          if cmp -s /tmp/py32/secondary_mcu_image.c src/zigbee/secondary_mcu_image.c; then
            echo "change=false" >> "$GITHUB_OUTPUT"
            echo "::notice::home-dimmer already carries $tag"
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$cur" "$new" | sort -V | tail -1)
          if [ "$FORCE" = true ] || [ -z "$cur" ] || { [ "$new" != "$cur" ] && [ "$newest" = "$new" ]; }; then
            :   # newer (or forced)
          elif [ "$new" = "$cur" ] && [ "$(bytes /tmp/py32/secondary_mcu_image.c)" = "$(bytes src/zigbee/secondary_mcu_image.c)" ]; then
            :   # the same image, only the generated file's text differs
          elif [ "$new" = "$cur" ]; then
            keep warning "home-dimmer carries another image with the same version $cur (carried by hand?): modules that have it are never offered $tag. Bump the version, or use force to replace it"
          else
            keep notice "$tag ($new) is older than what home-dimmer carries ($cur); use force to go back"
          fi
          echo "change=true" >> "$GITHUB_OUTPUT"
          cp /tmp/py32/secondary_mcu_image.c src/zigbee/secondary_mcu_image.c

      - name: Lint and tests with the image
        if: steps.rel.outputs.change == 'true' || inputs.force
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q make python3 python3-pytest python3-yaml python3-jinja2 uncrustify
          find src -name '*.c' -o -name '*.h' | xargs uncrustify -c uncrustify.cfg --check -q
          make tests

      - name: Commit to home-dimmer
        if: steps.rel.outputs.change == 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Carry PY32 $TAG"
          git push origin HEAD:home-dimmer

      - name: Build branch and module firmware
        if: steps.rel.outputs.change == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # one module build at a time: each one pushes its firmware commit to the branch
          for _ in $(seq 60); do
            busy=$(gh run list --workflow build.yml --branch home-dimmer_build --limit 10 \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            [ "$busy" = "0" ] && break
            echo "waiting for $busy running module build(s)"; sleep 30
          done
          git fetch -q origin fork-ci
          git checkout -q -B home-dimmer_build
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            cherry-pick FETCH_HEAD
          git push -f origin home-dimmer_build
          gh workflow run build.yml --ref home-dimmer_build
          echo "::notice::module firmware build started on home-dimmer_build"
