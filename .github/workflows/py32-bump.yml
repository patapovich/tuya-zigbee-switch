name: Carry a PY32 release
# The title names the tag, so zdms16-py32 tools/release/release.sh finds its run.
run-name: Carry PY32 ${{ inputs.py32_tag || github.event.client_payload.tag || 'latest release' }}

# patapovich fork only. The ZDMS16-2 build of the home-dimmer branch carries the own PY32
# MCU firmware (src/zigbee/secondary_mcu_image.c). This puts the newest release of
# patapovich/zdms16-py32 there (hourly check, or at once by hand / by a repository_dispatch
# "py32-release" from that repo), tests it, commits it to home-dimmer and builds the module
# firmware on home-dimmer_build (= home-dimmer + the fork-ci build change). It lives on the
# default branch because scheduled and dispatched workflows only run from there.
# A named tag (by hand or dispatched) that cannot be carried fails the run; the hourly check
# only notes it (home-dimmer ahead of the latest release, or carrying another image of the
# same version by hand).

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      py32_tag:
        description: "zdms16-py32 release tag (empty: the latest release)"
        required: false
      force:
        description: "build even if home-dimmer already carries it; allow an older version or replace another image of the same version"
        type: boolean
        default: false
  repository_dispatch:
    types: [py32-release]

permissions:
  contents: write
  actions: write

concurrency:
  group: py32-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: home-dimmer
          fetch-depth: 0

      - name: Release to carry
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.py32_tag || github.event.client_payload.tag }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -e
          tag="$TAG_IN"
          explicit=false   # a tag named by hand or by the dispatch: failures fail the run
          if [ -n "$tag" ]; then
            explicit=true
          else
            tag=$(gh release view --repo patapovich/zdms16-py32 --json tagName --jq .tagName)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag vX.Y.Z: '${tag//[^A-Za-z0-9._-]/?}'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo patapovich/zdms16-py32 \
            --pattern secondary_mcu_image.c --pattern SHA256SUMS --dir /tmp/py32
          (cd /tmp/py32 && grep -E '[ *]secondary_mcu_image\.c$' SHA256SUMS | sha256sum -c -)
          ver() { sed -n 's/.*own MCU firmware: version \([0-9.]*\).*/\1/p' "$1" | head -1; }
          bld() { sed -n 's/.*Image build: \([0-9]*\).*/\1/p' "$1" | head -1; }   # the update order
          bytes() { grep -E '^ +0x' "$1" || true; }   # the image itself (C array rows)
          new=$(ver /tmp/py32/secondary_mcu_image.c); cur=$(ver src/zigbee/secondary_mcu_image.c)
          if ! [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no version in the secondary_mcu_image.c of $tag"
            exit 1
          fi
          echo "release $tag carries $new, home-dimmer carries ${cur:-none}"
          keep() {  # level, message: home-dimmer stays as it is
            echo "change=false" >> "$GITHUB_OUTPUT"
            if [ "$explicit" = true ]; then
              echo "::error::$2"
              exit 1
            fi
            echo "::$1::$2"
            exit 0
          }
          if cmp -s /tmp/py32/secondary_mcu_image.c src/zigbee/secondary_mcu_image.c; then
            echo "change=false" >> "$GITHUB_OUTPUT"
            echo "::notice::home-dimmer already carries $tag"
            exit 0
          fi
          # Newer by the image build when both files name one (the module offers an update by the
          # build, so the carry decides the same way), else by the version.
          nb=$(bld /tmp/py32/secondary_mcu_image.c); cb=$(bld src/zigbee/secondary_mcu_image.c)
          echo "builds: release ${nb:-none}, home-dimmer ${cb:-none}"
          if [ -n "$nb" ] && [ -n "$cb" ]; then
            if [ "$nb" -gt "$cb" ]; then newer=true; else newer=false; fi
            same=$([ "$nb" -eq "$cb" ] && echo true || echo false)
          else
            newest=$(printf '%s\n%s\n' "$cur" "$new" | sort -V | tail -1)
            newer=$([ "$new" != "$cur" ] && [ "$newest" = "$new" ] && echo true || echo false)
            same=$([ "$new" = "$cur" ] && echo true || echo false)
          fi
          if [ "$FORCE" = true ] || [ -z "$cur" ] || [ "$newer" = true ]; then
            :   # newer (or forced)
          elif [ "$same" = true ] && [ "$(bytes /tmp/py32/secondary_mcu_image.c)" = "$(bytes src/zigbee/secondary_mcu_image.c)" ]; then
            :   # the same image, only the generated file's text differs
          elif [ "$same" = true ]; then
            keep warning "home-dimmer carries another image with the same build / version ($cur build ${cb:-?}, carried by hand?): modules that have it are never offered $tag. Use force to replace it"
          else
            keep notice "$tag ($new build ${nb:-?}) is older than what home-dimmer carries ($cur build ${cb:-?}); use force to go back"
          fi
          echo "change=true" >> "$GITHUB_OUTPUT"
          cp /tmp/py32/secondary_mcu_image.c src/zigbee/secondary_mcu_image.c

      # apt through home-dimmer's .github/ci/apt.sh (Azure mirror first, time limits, one retry on
      # the main archive; .deb files cached by their exact versions).
      - name: Packages (versions)
        id: apt
        if: steps.rel.outputs.change == 'true' || inputs.force
        timeout-minutes: 6
        run: |
          .github/ci/apt.sh --mirrors
          .github/ci/apt.sh update -q
          .github/ci/apt.sh key bump make python3 python3-pytest python3-yaml python3-jinja2 uncrustify

      - name: Packages cache
        id: apt-cache
        if: steps.apt.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-cache/*.deb
          key: ${{ steps.apt.outputs.key }}

      - name: Lint and tests with the image
        if: steps.rel.outputs.change == 'true' || inputs.force
        timeout-minutes: 30
        run: |
          .github/ci/apt.sh install-cached make python3 python3-pytest python3-yaml python3-jinja2 uncrustify
          find src -name '*.c' -o -name '*.h' | xargs uncrustify -c uncrustify.cfg --check -q
          make tests

      - name: Packages cache (save)
        if: steps.apt.outputs.key != '' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-cache/*.deb
          key: ${{ steps.apt.outputs.key }}

      - name: Commit to home-dimmer
        if: steps.rel.outputs.change == 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Carry PY32 $TAG"
          git push origin HEAD:home-dimmer

      - name: Build branch and module firmware
        id: build
        if: steps.rel.outputs.change == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # one module build at a time: each one pushes its firmware commit to the branch
          for _ in $(seq 60); do
            busy=$(gh run list --workflow build.yml --branch home-dimmer_build --limit 10 \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            [ "$busy" = "0" ] && break
            echo "waiting for $busy running module build(s)"; sleep 30
          done
          git fetch -q origin fork-ci
          git checkout -q -B home-dimmer_build
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            cherry-pick FETCH_HEAD
          git push -f origin home-dimmer_build
          # the build's id as board.mk makes it (VERSION_STR), from the head just pushed
          build=$(echo "$(cat VERSION)-$(git rev-parse --short HEAD)" | cut -c1-16)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          gh workflow run build.yml --ref home-dimmer_build
          echo "::notice::module firmware build $build started on home-dimmer_build"

      # docs/changelog_home_dimmer.md: "Next" becomes the section of this build (with the Open
      # Dimmer version it carries). After the build branch was cut, as its head names the build;
      # the build itself does not depend on it. A failure here only warns.
      - name: Changelog of the build
        if: steps.build.outputs.build != ''
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          git checkout -q home-dimmer
          if [ ! -f helper_scripts/home_dimmer_changelog.py ]; then
            echo "::notice::home-dimmer has no build changelog"
            exit 0
          fi
          carried=$(sed -n 's/.*own MCU firmware: version \([0-9.]*\).*/\1/p' src/zigbee/secondary_mcu_image.c | head -1)
          python3 helper_scripts/home_dimmer_changelog.py stamp --build "$BUILD" --carries "$carried" ||
            { echo "::warning::changelog not stamped for $BUILD"; exit 0; }
          git add docs/changelog_home_dimmer.md
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Changelog: build $BUILD"
            git push origin HEAD:home-dimmer || echo "::warning::changelog of $BUILD not pushed (home-dimmer moved?)"
          fi
          python3 helper_scripts/home_dimmer_changelog.py section "$BUILD" >> "$GITHUB_STEP_SUMMARY" || true
