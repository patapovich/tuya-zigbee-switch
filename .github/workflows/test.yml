name: test

on: [push, pull_request]

# apt goes through .github/ci/apt.sh: Azure's Ubuntu mirror first, a time limit per call and one
# retry on the main archive, and the .deb files cached under a key of their exact versions (a
# mirror outage then only touches the package index, which is retried on the other mirror).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Packages (versions)
        id: apt
        timeout-minutes: 6
        run: |
          .github/ci/apt.sh --mirrors
          .github/ci/apt.sh update -q
          .github/ci/apt.sh key lint uncrustify
      - name: Packages cache
        id: apt-cache
        if: steps.apt.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-cache/*.deb
          key: ${{ steps.apt.outputs.key }}
      - name: Install uncrustify
        timeout-minutes: 10
        run: .github/ci/apt.sh install-cached uncrustify
      - name: Packages cache (save)
        if: steps.apt.outputs.key != '' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-cache/*.deb
          key: ${{ steps.apt.outputs.key }}
      - name: Check code formatting
        run: |
          find src -name '*.c' -o -name '*.h' | xargs uncrustify -c uncrustify.cfg --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Packages (versions)
        id: apt
        timeout-minutes: 6
        run: |
          .github/ci/apt.sh --mirrors
          .github/ci/apt.sh update -q
          .github/ci/apt.sh key test make python3 python3-pytest python3-yaml python3-jinja2 python3-click
      - name: Packages cache
        id: apt-cache
        if: steps.apt.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-cache/*.deb
          key: ${{ steps.apt.outputs.key }}
      - name: Install pytests
        timeout-minutes: 10
        run: .github/ci/apt.sh install-cached make python3 python3-pytest python3-yaml python3-jinja2 python3-click
      - name: Packages cache (save)
        if: steps.apt.outputs.key != '' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-cache/*.deb
          key: ${{ steps.apt.outputs.key }}
      - name: Run tests
        run: make tests

  # patapovich fork, home-dimmer: a pushed change gets its module firmware (the OTA images on
  # home-dimmer_build) at once. py32-bump (on the default branch: dispatched workflows run from
  # there) builds when home-dimmer_build is older than home-dimmer, with its own lint and tests;
  # its hourly run does the same. Not for the build's own changelog stamp (no new firmware).
  module-build:
    needs: [lint, test]
    if: >-
      github.repository == 'patapovich/tuya-zigbee-switch' && github.event_name == 'push' &&
      github.ref == 'refs/heads/home-dimmer' &&
      !startsWith(github.event.head_commit.message, 'Changelog: build')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the module firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run py32-bump.yml --repo "$GITHUB_REPOSITORY" --ref main
