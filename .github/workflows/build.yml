name: Build Firmware

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main
#  pull_request:
#    branches:
#      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  

    # apt through .github/ci/apt.sh (Azure mirror first, time limits, one retry on the archive; the
    # .deb files cached by their exact versions; no recommends: gcc-arm-none-eabi would pull a
    # 463 MB C++ library nothing here links).
    - name: Packages (versions)
      id: apt
      timeout-minutes: 6
      run: |
        .github/ci/apt.sh --mirrors
        .github/ci/apt.sh update -q
        .github/ci/apt.sh key build make python3 yq unzip wget gcc-arm-none-eabi

    - name: Packages cache
      id: apt-cache
      if: steps.apt.outputs.key != ''
      uses: actions/cache/restore@v6
      with:
        path: ~/apt-cache/*.deb
        key: ${{ steps.apt.outputs.key }}

    - name: Install dependencies
      timeout-minutes: 12
      run: .github/ci/apt.sh install-cached make python3 yq unzip wget gcc-arm-none-eabi

    - name: Packages cache (save)
      if: steps.apt.outputs.key != '' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/apt-cache/*.deb
        key: ${{ steps.apt.outputs.key }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Cache Silicon Labs Tools
      uses: actions/cache@v6
      with:
        path: silabs_tools
        key: silabs-tools-2025.6.2

    - name: Cache Telink Tools
      uses: actions/cache@v6
      with:
        path: telink_tools
        key: telink-tools-v3.7.2.0

    - name: Cache Python Virtual Environment
      uses: actions/cache@v6
      with:
        path: .venv
        key: python-venv-${{ hashFiles('requirements.txt') }}

    - name: Install SDK and Toolchain
      run: |
        make telink/tools/all setup_venv || (
          echo "dumping log:" &&
          cat /home/runner/work/tuya-zigbee-switch/tuya-zigbee-switch/silabs_tools/slc-cli/bin/slc-cli/configuration/*.log
        )

    - name: Clear out index files
      run: |
        source .venv/bin/activate
        make tools/clean_z2m_index 

    - name: Build ZDMS16-2 only (fork build branch)
      run: |
        source .venv/bin/activate
        BOARD=MODULE_AVATTO_ZDMS16_2 DEVICE_TYPE=router make board/build
        ls -l bin/router/MODULE_AVATTO_ZDMS16_2/
    - name: Update Z2M converters
      run: |
        source .venv/bin/activate
        make tools/update_converters

    - name: Update ZHA quirks
      run: |
        source .venv/bin/activate
        make tools/update_zha_quirk

    - name: Update HOMEd extensions
      run: |
        source .venv/bin/activate
        make tools/update_homed_extension

    - name: Update supported_devices.md
      run: |
        source .venv/bin/activate
        make tools/update_supported_devices

    - name: Commit changes
      run: |
        source .venv/bin/activate
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add bin/* zigbee2mqtt/* zha/* homed/* docs/supported_devices.md
        git diff --cached --quiet || git commit -m "Update firmware files, converters, quirks, extensions and supported devices list"
        make tools/freeze_ota_links
        git add zigbee2mqtt/*
        git diff --cached --quiet || git commit -m "Freeze links in OTA index files"
        git push
