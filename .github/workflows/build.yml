name: Build Firmware

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main
#  pull_request:
#    branches:
#      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  

    # apt through .github/ci/apt.sh (Azure mirror first, time limits, one retry on the archive; the
    # .deb files cached by their exact versions; no recommends: gcc-arm-none-eabi would pull a
    # 463 MB C++ library nothing here links).
    - name: Packages (versions)
      id: apt
      timeout-minutes: 6
      run: |
        .github/ci/apt.sh --mirrors
        .github/ci/apt.sh update -q
        .github/ci/apt.sh key build make python3 yq unzip wget gcc-arm-none-eabi

    - name: Packages cache
      id: apt-cache
      if: steps.apt.outputs.key != ''
      uses: actions/cache/restore@v6
      with:
        path: ~/apt-cache/*.deb
        key: ${{ steps.apt.outputs.key }}

    - name: Install dependencies
      timeout-minutes: 12
      run: .github/ci/apt.sh install-cached make python3 yq unzip wget gcc-arm-none-eabi

    - name: Packages cache (save)
      if: steps.apt.outputs.key != '' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/apt-cache/*.deb
        key: ${{ steps.apt.outputs.key }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Cache Silicon Labs Tools
      uses: actions/cache@v6
      with:
        path: silabs_tools
        key: silabs-tools-2025.6.2

    - name: Cache Telink Tools
      uses: actions/cache@v6
      with:
        path: telink_tools
        key: telink-tools-v3.7.2.0

    - name: Cache Python Virtual Environment
      uses: actions/cache@v6
      with:
        path: .venv
        key: python-venv-${{ hashFiles('requirements.txt') }}

    - name: Install SDK and Toolchain
      run: |
        make setup || (
          echo "dumping log:" &&
          cat /home/runner/work/tuya-zigbee-switch/tuya-zigbee-switch/silabs_tools/slc-cli/bin/slc-cli/configuration/*.log
        )

    - name: Clear out index files
      run: |
        source .venv/bin/activate
        make tools/clean_z2m_index 

    - name: Build for all boards
      run: |
        source .venv/bin/activate
        yq -r 'to_entries | sort_by(.key)[] | "\(.key) \(.value.device_type) \(.value.build)"' device_db.yaml | while read ITER TYPE BUILD; do

          if [ "$BUILD" = "no" ]; then
            echo "Skipping $ITER as building this model is disabled in the db."
            continue
          fi
  
          echo "Building for board: $ITER (router)"
          BOARD=$ITER DEVICE_TYPE=router make board/build || exit 1
          echo "Checking if files were created for board: $ITER (router)"
          ls -l bin/router/$ITER/

          if [ "$TYPE" = "end_device" ]; then
            echo "Building for board: $ITER (end_device)"
            BOARD=${ITER} DEVICE_TYPE=end_device make board/build || exit 1
            echo "Checking if files were created for board: $ITER (end_device)"
            ls -l bin/end_device/${ITER}_END_DEVICE/
          fi
        done

    - name: Update Z2M converters
      run: |
        source .venv/bin/activate
        make tools/update_converters

    - name: Update ZHA quirks
      run: |
        source .venv/bin/activate
        make tools/update_zha_quirk

    - name: Update HOMEd extensions
      run: |
        source .venv/bin/activate
        make tools/update_homed_extension

    - name: Update supported_devices.md
      run: |
        source .venv/bin/activate
        make tools/update_supported_devices

    - name: Commit changes
      run: |
        source .venv/bin/activate
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add bin/* zigbee2mqtt/* zha/* homed/* docs/supported_devices.md
        git diff --cached --quiet || git commit -m "Update firmware files, converters, quirks, extensions and supported devices list"
        make tools/freeze_ota_links
        git add zigbee2mqtt/*
        git diff --cached --quiet || git commit -m "Freeze links in OTA index files"
        git push

    # patapovich fork, home-dimmer_build only: the build's OTA images become the assets of its
    # own release (tag zdms16-2-<build>, ts110e-3mpwqzuu-<build>) and the index files point
    # there, because GitHub counts release downloads (download_count) but not raw ones.
    # Zigbee2MQTT follows the redirect of releases/download and the sha512 stays the same; the
    # index files stay where they are. The index moves off the raw links only after the assets
    # were checked against the files, so it names files that exist at every moment.
    # Undownloaded releases beyond the 10 newest of a prefix go (their tags stay). One run per
    # board (--bin-dir): every board's files have the same names. A board this build left out
    # has no entry: its run publishes nothing.
    - name: Publish OTA images as release assets
      if: github.repository == 'patapovich/tuya-zigbee-switch' && github.ref_name == 'home-dimmer_build'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        source .venv/bin/activate
        INDEX_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/zigbee2mqtt/ota/index_router.json"
        CHANGELOG="Build changelog: https://github.com/$GITHUB_REPOSITORY/blob/home-dimmer/docs/changelog_home_dimmer.md"
        python3 helper_scripts/ota_release_assets.py \
          --repo "$GITHUB_REPOSITORY" --tag-prefix zdms16-2 --name "AVATTO ZDMS16-2" \
          --bin-dir bin/router/MODULE_AVATTO_ZDMS16_2 \
          --commit "$(git rev-parse HEAD)" --keep 10 --index-url "$INDEX_URL" --link "$CHANGELOG" \
          --link "Open Dimmer and the install guide: https://github.com/patapovich/open-dimmer" \
          zigbee2mqtt/ota/index_router.json zigbee2mqtt/ota/index_router-FORCE.json
        # the TS110E's factory dimming MCU is kept: no MCU image in it
        python3 helper_scripts/ota_release_assets.py \
          --repo "$GITHUB_REPOSITORY" --tag-prefix ts110e-3mpwqzuu --name "Tuya TS110E (ZH-Z06)" \
          --bin-dir bin/router/MODULE_TUYA_TS110E_3MPWQZUU --carried-image "" \
          --commit "$(git rev-parse HEAD)" --keep 10 --index-url "$INDEX_URL" --link "$CHANGELOG" \
          --link "The TS110E support: https://github.com/$GITHUB_REPOSITORY/blob/home-dimmer/docs/ts110e.md" \
          zigbee2mqtt/ota/index_router.json zigbee2mqtt/ota/index_router-FORCE.json
        git add zigbee2mqtt/ota/*.json
        git diff --cached --quiet || git commit -m "Point OTA index files at the release assets"
        git push
